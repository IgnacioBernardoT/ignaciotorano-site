name: Publish approved post to Google Business Profile

# Fires when a merge to main lands a pending GBP post.
# (Merging the approval PR is the trigger — merge = approve.)
on:
  push:
    branches: [ main ]
    paths:
      - 'automation/pending/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gbp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish pending posts to GBP
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: python automation/publish_gbp.py

      - name: Record published state + true post date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add blog/ automation/pending automation/posted automation/topics.csv
          if git diff --cached --quiet; then
            echo "Nothing to record."
            exit 0
          fi
          git commit -m "Publish: set true post date + mark published"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          exit 1
